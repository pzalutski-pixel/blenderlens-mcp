name: Publish to PyPI

# Uploads one release's wheel and sdist to PyPI: the files attached to its GitHub release, which the release
# workflow built, checked and attested. It runs when the release workflow succeeds, and by hand for a tag, so a
# failed upload is retried on its own. A version PyPI already has is left as it is, so a retry is always safe.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The released tag to publish (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish-pypi:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing proves this workflow's identity to PyPI with its OIDC token
      attestations: read # gh attestation verify reads the release files' attestations
    steps:
      # The released commit, never the branch head: the checks below run the release kit as it was released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: The tag and every manifest carry one version
        env:
          DISPATCHED_TAG: ${{ inputs.tag }}
          RELEASED_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${DISPATCHED_TAG:-$RELEASED_TAG}"
          version="$(python .github/scripts/release_kit.py versions --tag "$tag")" || { echo "$version"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Skip a version PyPI already has
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/blenderlens-mcp/$VERSION/json")"
          if [ "$status" = 200 ]; then
            echo "blenderlens-mcp $VERSION is already on PyPI; nothing to upload."
            echo "PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      - name: Download the release's wheel and sdist, and check them
        if: env.PUBLISHED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel="blenderlens_mcp-$VERSION-py3-none-any.whl"
          sdist="blenderlens_mcp-$VERSION.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "$wheel" --pattern "$sdist"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sums --pattern SHA256SUMS
          (cd dist && grep -E "  ($wheel|$sdist)\$" ../sums/SHA256SUMS | sha256sum --check --strict -)
          for file in dist/*; do gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"; done
          python .github/scripts/release_kit.py dist dist --version "$VERSION"

      # PyPI accepts the upload through trusted publishing: the project's settings on pypi.org trust this
      # repository's publish-pypi.yml, so no PyPI token is stored.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: env.PUBLISHED != '1'
